name: Build unsigned iOS IPA

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Notification Blaster for iPhone
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned iOS Release app
        working-directory: outputs/NotificationBlaster
        run: >-
          xcodebuild
          -project NotificationBlaster.xcodeproj
          -scheme NotificationBlaster
          -configuration Release
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/NotificationBlasterDerivedData"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGNING_IDENTITY=""
          build

      - name: Package unsigned IPA
        working-directory: outputs/NotificationBlaster
        run: |
          APP_PATH="$RUNNER_TEMP/NotificationBlasterDerivedData/Build/Products/Release-iphoneos/NotificationBlaster.app"
          IPA_ROOT="$RUNNER_TEMP/NotificationBlasterIPARoot"
          IPA_PATH="$RUNNER_TEMP/NotificationBlaster.ipa"
          test -d "$APP_PATH"
          mkdir -p "$IPA_ROOT/Payload"
          cp -R "$APP_PATH" "$IPA_ROOT/Payload/"
          (cd "$IPA_ROOT" && /usr/bin/zip -qry "$IPA_PATH" Payload)

          unzip -t "$IPA_PATH"
          unzip -Z1 "$IPA_PATH" | grep -Fxq 'Payload/NotificationBlaster.app/Info.plist'

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NotificationBlaster-unsigned-ipa
          path: ${{ runner.temp }}/NotificationBlaster.ipa
          if-no-files-found: error
          retention-days: 14

